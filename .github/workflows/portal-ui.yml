name: Build portal-ui

# Mirrors 6G-DALI/dataops/.github/workflows/dataops-orchestrator.yml. The only
# structural difference: the portal is its own repository, so the build context
# is the repo root and no `paths:` filter is needed.
on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/portal-ui

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Required by the GHA cache below: the runner's default buildx driver is
      # `docker`, which cannot export a cache ("Cache export is not supported
      # for the docker driver"). This sets up a `docker-container` builder.
      # Drop this step if you also drop cache-from/cache-to.
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      # The Dockerfile runs `npm run build`, which is `tsc --noEmit && vite build`,
      # so a type error fails the image build — no separate check job needed.
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

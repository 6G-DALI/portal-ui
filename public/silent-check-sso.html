<!DOCTYPE html>
<!--
  Silent SSO check target for keycloak-js.

  Loaded in a hidden iframe by `checkLoginIframe`/`check-sso` so the portal can
  discover an existing realm session WITHOUT redirecting away from the public
  landing page. It only forwards the callback fragment to the parent window.

  If third-party cookies are blocked the check simply fails and the visitor is
  treated as anonymous — they see the landing page and can sign in explicitly.
-->
<html>
  <body>
    <script>
      parent.postMessage(location.href, location.origin)
    </script>
  </body>
</html>

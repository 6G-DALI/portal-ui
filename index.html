<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <meta name="description" content="6G-DALI Portal — central entry point for all DALI services and documentation" />
    <!-- Painted before the bundle loads so there is no light flash on first paint. -->
    <style>
      html, body { background: #0a0d12; }
    </style>
    <!--
      Warms the connection to the identity provider.

      Nothing renders until keycloak.init() resolves, and its silent-SSO check
      is an iframe to a DIFFERENT origin — so without this the DNS lookup and
      TLS handshake for that origin only begin once the bundle has downloaded
      and started executing. Preconnecting moves that setup off the critical
      path and into the window where the bundle is still arriving.

      The href is rewritten at container start by 45-portal-preconnect.sh from
      $KEYCLOAK_ORIGIN — the same value the CSP uses. The literal below is only
      the development default; a preconnect to a host that is never used costs
      one idle socket, so a stale value here is harmless rather than breaking.
    -->
    <link rel="preconnect" href="https://auth.dspace.sparkworks.net" data-portal-preconnect>
    <link rel="dns-prefetch" href="https://auth.dspace.sparkworks.net" data-portal-preconnect>
    <!--
      Runtime configuration (§27). Loaded before the bundle so a deployment can
      repoint service URLs and the Keycloak realm/client by editing one file in
      the container, with no rebuild. Empty values fall back to build-time env,
      then to the defaults in src/config.ts.
    -->
    <script src="/config.js"></script>
    <title>6G-DALI Portal</title>
  </head>
  <!-- Same AdminLTE body classes as dataops-ui, so both shells behave identically. -->
  <body class="layout-fixed sidebar-expand-lg">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
